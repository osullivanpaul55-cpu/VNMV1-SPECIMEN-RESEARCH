name: Five articulated family rig research runners
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/articulated_family_pilot_v1.py'
      - 'tests/test_articulated_family_pilot_v1.py'
      - '.github/workflows/articulated-family-rig-five.yml'
  pull_request:
    paths:
      - 'research/articulated_family_pilot_v1.py'
      - 'tests/test_articulated_family_pilot_v1.py'
      - '.github/workflows/articulated-family-rig-five.yml'
permissions:
  contents: read
concurrency:
  group: vnmv1-family-rig-five
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'trimesh>=4,<5' 'numpy>=1.24,<3'
      - run: python -m unittest discover -s tests -p 'test_articulated_family_pilot_v1.py' -v
  family-rigs:
    if: github.event_name != 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'trimesh>=4,<5' 'numpy>=1.24,<3'
      - run: >-
          python research/articulated_family_pilot_v1.py
          --source data/roster_taxon_identity_evidence.json
          --shard ${{ matrix.shard }} --out output/family-shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: vnmv1-unapproved-articulated-family-rigs-${{ matrix.shard }}
          path: output/family-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7
      - run: |
          echo 'Family-scoped generic articulated 3D node hierarchies produced.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO species-specific measurements, skinning, animations, biological certification or human approval.' >> "$GITHUB_STEP_SUMMARY"
