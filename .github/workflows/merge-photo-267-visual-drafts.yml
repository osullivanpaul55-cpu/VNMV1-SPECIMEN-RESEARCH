name: Merge inspected 267 photo enrichment drafts
on:
  push:
    branches: [main]
    paths:
      - "research/photo_267_visual_notes.b85"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Merge annotations and fail-closed against source photographs
        run: python research/merge_267_visual_notes.py
      - name: Check public reviewer syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page=Path('review/index.html').read_text()
          js=re.findall(r'<script[^>]*>(.*?)</script>',page,re.S)[-1]
          Path('/tmp/check_review.js').write_text(js)
          PY
          node --check /tmp/check_review.js
      - name: Publish validated research visual drafts to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/photo_visual_reviews.json
          if git diff --cached --quiet; then
            echo 'No new visual drafts'; exit 0
          fi
          git commit -m 'Add 267 inspected photo drafts, completing 387 public references'
          git push origin HEAD:main
