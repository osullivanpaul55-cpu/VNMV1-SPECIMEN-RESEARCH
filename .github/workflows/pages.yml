name: Publish specimen photo review webpage
on:
  workflow_dispatch:
  schedule:
    # Fallback: Actions-token index commits do not trigger push workflows.
    - cron: '09 08 * * *'
  push:
    branches: [main]
    paths:
      - 'data/index.json'
      - 'research/coverage_report.py'
      - 'research/species_seed.json'
      - 'research/species_reference_extension.json'
      - 'review/index.html'
      - '.github/workflows/pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: specimen-review-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build per-species coverage report and public static website
        run: |
          mkdir -p _site/review _site/data
          python research/coverage_report.py --index data/index.json --seed research/species_seed.json --extension research/species_reference_extension.json --csv data/species_coverage.csv --summary data/species_coverage_summary.json
          git config user.name 'VNMV1 public research bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/species_coverage.csv data/species_coverage_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: refresh species photo coverage report [skip ci]'
            git push origin HEAD:main
          fi
          cp review/index.html _site/review/index.html
          cp data/index.json _site/data/index.json
          cp data/species_coverage.csv _site/data/species_coverage.csv
          cp data/species_coverage_summary.json _site/data/species_coverage_summary.json
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./review/"><title>VNMV1 Reference Review</title><a href="./review/">Open specimen review</a></html>' > _site/index.html
          printf 'GitHub Pages review interface; all images are unapproved research candidates.\n' > _site/README.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment